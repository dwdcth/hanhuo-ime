[package]
name = "hanhuo-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
hanhuo-core = { path = "../hanhuo-core", features = ["safetensors"] }
hanhuo-dict = { path = "../hanhuo-dict" }
hanhuo-lm = { path = "../hanhuo-lm", features = ["safetensors", "zhiyi"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "hanhuo"
path = "src/main.rs"
