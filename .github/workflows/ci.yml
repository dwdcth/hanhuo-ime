name: CI
# 触发律（2026-11-13 用户指令 + 11-14 本地化修正）:
#   - 日常验证在本地 tools/ci_local.sh（免费额度有限, 不逐提交跑）
#   - 远端只在打 v* tag 时跑（发布锚; b2d03da 起的纪律——11-14 本地化
#     改造时误删 tag 触发, 本轮补回）
#   - workflow_dispatch 手动备急
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - name: LFS 全量拉取（checkout lfs:true 在部分环境不拉全——
          指针态文件致 open_build 静默空表, 实测 60.1MB 假 bin）
        run: git lfs pull
      - name: Build
        run: cargo build --release -p hanhuo-cli
      - name: Test
        run: cargo test --release -p hanhuo-core -p hanhuo-lm -p hanhuo-dict -p hanhuo-cli
      - name: Golden（自洽回归锁, CI 锚双快照制）
        env:
          WXQ_BIN: ${{ github.workspace }}/open/hanhuo_open.bin
        run: |
          pip install numpy
          # 词典构建（仓内钉版源 data/rimeice_cn——行为全锁定）
          python3 tools/open_build.py
          md5sum open/hanhuo_open.bin
          # 双锚律（v0.1.1 轮定谳, 2026-11-14）: 本地 rustc 与 CI stable
          # 浮点/排序分叉（bin md5 逐位同/logp 同/score 罚分域差 3.0/kind
          # 翻转）——一个快照不可能双端 611。CI 门用 ci_golden.jsonl
          # （CI 环境产出）; 本地门 open_golden.jsonl（本地 rustc 产出,
          # ci_local.sh 用）。行为变更时双锚都要重产: 本地重跑
          # snapshot.py; CI 锚下载本轮 artifact 替换。
          target/release/hanhuo golden golden/ci_golden.jsonl
      # 快照锚律（双快照制, 2026-11-14）: 下方 artifact 是 CI 锚
      # ci_golden.jsonl 的重产源——行为变更轮下载替换提交（本地锚
      # open_golden.jsonl 由本地 snapshot.py 重产, 两锚各守一门）。
      - name: 快照 artifact（CI 环境锚）
        if: always()
        env:
          WXQ_BIN: ${{ github.workspace }}/open/hanhuo_open.bin
        run: python3 tools/snapshot.py /tmp/snap_ci.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-snapshot-ci
          path: /tmp/snap_ci.jsonl
          retention-days: 30
