[package]
name = "hanhuo-lm"
version = "0.1.0"
edition = "2021"
description = "语言模型与容器层：wxq.bin 容器读取（pack）/ NNLM / mdltr LightGBM / lmcn 域表"

[dependencies]
memmap2 = "0.5"
bytemuck = "1"

# SafeTensors 可选格式（部署优化线; 默认关闭——主引擎走 pack.rs 原生格式保位精确）
[features]
safetensors = ["dep:safetensors", "dep:half", "dep:anyhow", "dep:tracing", "dep:hanhuo-dict", "dep:serde_json"]
zhiyi = ["dep:candle-core", "dep:candle-nn", "dep:safetensors", "dep:serde_json", "dep:half"]

# 知意双条件选词模型推理（Apache-2.0 开源资产; candle 纯 Rust——
# 效果验证线, wasm 线后续按需手写精简）
[dependencies.candle-core]
version = "0.9"
optional = true

[dependencies.candle-nn]
version = "0.9"
optional = true

# feature 专用依赖
[dependencies.safetensors]
version = "0.4"
optional = true

[dependencies.half]
version = "2"
optional = true

[dependencies.anyhow]
version = "1"
optional = true

[dependencies.tracing]
version = "0.1"
optional = true

# nnlm_adv golden 测试的基准向量解析
[dependencies.serde_json]
version = "1"
optional = true

# lmcn_safetensors 的 k2 来自词库层
[dependencies.hanhuo-dict]
path = "../hanhuo-dict"
optional = true
