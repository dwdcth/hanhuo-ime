<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>汉火输入法 · 网页演示</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main class="wrap">
    <header class="topbar">
      <h1>汉火输入法 <span class="sub">网页静态演示</span></h1>
      <div class="status-cluster">
        <span id="status-pill" class="pill loading">引擎加载中</span>
        <button id="retry-engine" class="ghost-btn" type="button" hidden>重载引擎</button>
        <button id="clear-cache" class="ghost-btn" type="button">清除缓存</button>
        <button id="settings-btn" class="ghost-btn" type="button" aria-expanded="false" aria-controls="settings-panel">⚙ 设置</button>
      </div>
    </header>

    <!-- 设置面：每页候选数 / 主题 -->
    <section id="settings-panel" class="settings" hidden>
      <div class="set-row">
        <label for="topk-range">每页候选数</label>
        <input id="topk-range" type="range" min="5" max="20" step="1" aria-label="每页候选数（5-20）">
        <output id="topk-val" for="topk-range">10</output>
      </div>
      <div class="set-row" role="radiogroup" aria-label="界面主题">
        <span class="set-label">主题</span>
        <div class="setting-row">
          <label for="t9-toggle">T9 九宫模式（2-9 键串）</label>
          <input id="t9-toggle" type="checkbox" aria-label="T9 九宫模式">
        </div>
        <div id="theme-seg" class="seg">
          <button type="button" data-theme-opt="auto" aria-checked="false">跟随系统</button>
          <button type="button" data-theme-opt="light" aria-checked="false">浅色</button>
          <button type="button" data-theme-opt="dark" aria-checked="false">深色</button>
        </div>
      </div>
    </section>

    <div class="statusbar">
      <span id="status-msg">正在探测引擎…</span>
      <span id="engine-info" class="muted"></span>
      <span id="perf" class="muted"></span>
      <div id="progress-bar" class="progress" style="display:none"><div id="progress-fill"></div></div>
    </div>

    <section class="ime">
      <!-- 已上屏文本（组合区）：点击定位插入点，右上角显示字数 -->
      <div class="committed-row">
        <div id="committed" class="committed" title="点击定位插入点"></div>
        <span id="committed-count" class="committed-count" aria-live="off"></span>
        <div id="preedit" class="preedit"></div>
      </div>

      <!-- 拼音输入 -->
      <input id="pinyin" class="pinyin-input" type="text" inputmode="latin" autocomplete="off"
             autocorrect="off" autocapitalize="off" spellcheck="false"
             placeholder="输入全拼，如 nihao / jintiantianqibucuo / mulujiegou" aria-label="拼音输入">

      <!-- 候选栏 -->
      <div id="candidates" class="candidates" aria-live="polite"><span class="empty">（无候选）</span></div>

      <!-- 候选翻页（超过一屏时可见） -->
      <div id="cand-pager" class="cand-pager" hidden>
        <button id="page-prev" class="page-btn" type="button" aria-label="上一页">‹</button>
        <span id="page-ind" class="page-ind">1/1</span>
        <button id="page-next" class="page-btn" type="button" aria-label="下一页">›</button>
      </div>

      <div class="hints">
        <span>空格/回车 = 首选上屏</span><span>数字键 1-9/0 = 选词</span><span>退格 = 删拼音/删光标前已上屏</span><span>Esc = 清空拼音</span><span>←/→ = 候选翻页</span><span>点击上屏区 = 定位插入</span>
        <span id="latency" class="muted"></span>
      </div>
    </section>

    <section class="examples" id="examples">
      <span class="muted">示例：</span>
      <button type="button" data-example="nihao">nihao</button>
      <button type="button" data-example="jintiantianqibucuo">jintiantianqibucuo</button>
      <button type="button" data-example="mulujiegou">mulujiegou</button>
    </section>

    <footer class="foot">
      <div id="cache-info" class="muted"></div>
      <div class="muted">纯静态页 · 无后端 · 词典等资产缓存在 IndexedDB（见 STORAGE.md）· 引擎未部署时自动切 Mock 演示</div>
    </footer>
  </main>
</body>
</html>
