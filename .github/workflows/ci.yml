name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p hanhuo-cli
      - name: Test
        run: cargo test --release -p hanhuo-core -p hanhuo-lm -p hanhuo-dict -p hanhuo-cli
      - name: Golden（自洽回归锁）
        env:
          WXQ_BIN: ${{ github.workspace }}/open/hanhuo_open.bin
        run: |
          pip install numpy
          # 词典构建（rime-ice 源下载）
          mkdir -p ~/tmp/rimeice_cn && cd ~/tmp/rimeice_cn
          for f in 8105 41448 base ext others; do
            curl -sLO "https://raw.githubusercontent.com/iDvel/rime-ice/main/cn_dicts/$f.dict.yaml"
          done
          cd $GITHUB_WORKSPACE
          python3 tools/open_build.py
          target/release/hanhuo golden golden/open_golden.jsonl
