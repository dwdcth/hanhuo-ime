[package]
name = "hanhuo-wasm"
version = "0.1.0"
edition = "2021"
description = "hanhuo 引擎 wasm 壳（浏览器端到端）: open_bytes + query JSON"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hanhuo-core = { path = "../hanhuo-core", features = ["safetensors"] }
hanhuo-lm = { path = "../hanhuo-lm", features = ["safetensors"] }
hanhuo-dict = { path = "../hanhuo-dict" }
wasm-bindgen = "0.2.130"
