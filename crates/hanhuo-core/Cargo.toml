[package]
name = "hanhuo-core"
version = "0.1.0"
edition = "2021"
description = "汉火输入法引擎核心（脑）：wxq.bin 查询管线的 Rust 忠实移植"

[dependencies]
hanhuo-types = { path = "../hanhuo-types" }
hanhuo-lm = { path = "../hanhuo-lm" }
hanhuo-dict = { path = "../hanhuo-dict" }

# 测试专供: B7 句序列重排单测装载 data/nnlm_mobile_fp32.safetensors
# （仅 dev 构建启用 safetensors feature, 不进生产依赖面）
[dev-dependencies]
hanhuo-lm = { path = "../hanhuo-lm", features = ["safetensors"] }

[features]
# 转发 hanhuo-lm/safetensors——nnlm_adv（高级版 NNLM）等开放格式装载的
# 编译门。cli/wasm 恒开；纯 core 裸构建默认关（保位精确主链不受
# safetensors/half/anyhow 依赖影响）。
safetensors = ["hanhuo-lm/safetensors"]
